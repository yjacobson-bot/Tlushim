name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK to app-release.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk app-release.apk

      - name: Get version tag
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d')-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "תלושים ${{ steps.version.outputs.tag }}"
          body: |
            ## 📲 הורדת האפליקציה

            1. לחץ על **app-release.apk** למטה
            2. פתח את הקובץ בטלפון
            3. אפשר התקנה ממקורות לא ידועים אם נדרש

            > ⚠️ הגדרות → אפליקציות → התקן מקורות לא ידועים → אפשר
          files: app-release.apk
          make_latest: true
